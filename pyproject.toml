[project]
name = "spatial-etl"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14",
    "pyarrow",
    "geoarrow-pyarrow>=0.2.0",
    "duckdb>=1.5.0",
    "pyyaml",
    "python-dotenv",
    "shapely>=2.0",
    "apache-sedona[db]>=0.3",
]

[project.optional-dependencies]
sedona = ["sedona-db"]

[tool.setuptools.packages.find]
include = ["spatial_pruning_toolkit*"]